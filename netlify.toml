[build]
  publish = "dist"
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.10.0"

[[redirects]]
  from = "/presentation"
  to = "/presentation/"
  status = 301

[[redirects]]
  from = "/presentation/*"
  to = "/presentation/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/presentation/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
